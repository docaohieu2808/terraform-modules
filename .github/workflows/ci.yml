# Proves every level of the repo on GitHub-hosted runners, on each push and once a week (so a new
# Terraform, provider, OPA or Terragrunt release that breaks the labs shows up here first).
# Nothing here talks to a cloud: the google provider is mocked (terraform test) or given a fake
# access token for an offline `terraform plan`, and the local levels use the random/local providers.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.17.0
  TFLINT_VERSION: v0.65.0
  OPA_VERSION: 1.21.4
  CONFTEST_VERSION: 0.71.1
  TERRAGRUNT_VERSION: 1.2.1
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.plugin-cache
  # A syntactically valid but fake token: the google provider only needs *a* credential to
  # configure itself, and planning new resources makes no API call.
  GOOGLE_OAUTH_ACCESS_TOKEN: fake-token-no-cloud-access
  TF_VAR_project_id: example-lab-project

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: ${{ env.OPA_VERSION }}
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
      - name: tflint
        run: tflint --recursive --format compact
      - name: opa fmt and strict check
        run: |
          opa fmt --list --fail policy
          opa check --strict policy

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: init -backend=false and validate every root module
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          status=0
          for dir in environments/* modules/* levels/l1-local-basics levels/l2-modules-for-each; do
            echo "::group::$dir"
            if terraform -chdir="$dir" init -backend=false -lockfile=readonly >/dev/null \
               && terraform -chdir="$dir" validate; then echo "ok   $dir"; else echo "FAIL $dir"; status=1; fi
            echo "::endgroup::"
          done
          exit "$status"

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: terraform test (mocked google provider) for the GCP modules
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for module in gcp-network gcp-compute gcp-storage gcp-gke; do
            echo "::group::$module"
            terraform -chdir="modules/$module" init -backend=false -lockfile=readonly >/dev/null
            terraform -chdir="modules/$module" test
            echo "::endgroup::"
          done
      - name: terraform test (real apply, random + local providers) for L1 and L2
        run: |
          for level in l1-local-basics l2-modules-for-each; do
            echo "::group::$level"
            terraform -chdir="levels/$level" init -lockfile=readonly >/dev/null
            terraform -chdir="levels/$level" test
            echo "::endgroup::"
          done
      - name: L3 state move demo
        run: levels/l3-state-moved/demo.sh

  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: ${{ env.OPA_VERSION }}
      - name: Install conftest ${{ env.CONFTEST_VERSION }} (checksum verified)
        run: |
          base="https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}"
          curl -sSfLO "$base/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          curl -sSfL "$base/checksums.txt" | grep "conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" | sha256sum -c -
          tar -xzf "conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" conftest
          sudo install conftest /usr/local/bin/conftest
      - name: opa test (unit tests for every deny rule)
        run: opa test policy --verbose
      - name: Plan every environment offline and run conftest on the plan JSON
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR" plans
          for env in dev staging prod; do
            terraform -chdir="environments/$env" init -backend=false -lockfile=readonly >/dev/null
            terraform -chdir="environments/$env" plan -out="$PWD/plans/$env.tfplan" >/dev/null
            terraform -chdir="environments/$env" show -json "$PWD/plans/$env.tfplan" > "plans/$env.json"
            conftest test "plans/$env.json" -p policy
          done
      - name: A non-compliant plan must be rejected (the gate can go red)
        run: |
          jq '(.resource_changes[] | select(.type == "google_compute_firewall") | .change.after.source_ranges) = ["0.0.0.0/0"]' \
            plans/dev.json > plans/dev-bad.json
          if conftest test plans/dev-bad.json -p policy; then
            echo "conftest accepted SSH open to the internet"; exit 1
          fi
          echo "rejected as expected"

  terragrunt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Install terragrunt ${{ env.TERRAGRUNT_VERSION }} (checksum verified)
        run: |
          base="https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}"
          curl -sSfLO "$base/terragrunt_linux_amd64"
          curl -sSfL "$base/SHA256SUMS" | grep " terragrunt_linux_amd64$" | sha256sum -c -
          sudo install terragrunt_linux_amd64 /usr/local/bin/terragrunt
      - name: hcl fmt check
        run: terragrunt hcl fmt --check
      - name: Every environment renders and validates through Terragrunt
        env:
          TG_TF_PATH: terraform
          TG_NO_TIPS: "true"
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for env in dev staging prod; do
            echo "::group::$env"
            cd "environments/$env"
            terragrunt render > /dev/null
            # init -backend=false: the generated backend.tf is written but no bucket is contacted
            terragrunt run --non-interactive -- init -backend=false -lockfile=readonly
            terragrunt run --non-interactive -- validate
            grep -rq 'backend "gcs"' --include=backend.tf .terragrunt-cache
            cd ../..
            echo "::endgroup::"
          done
